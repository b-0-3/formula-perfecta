/* Layout: muro de boxes. Cabecera fija tipo torre de tiempos + pestañas; paneles apilados en móvil, dos columnas en escritorio. Colores de estado = compuestos de neumático. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E2E6EC; --line:#CDD3DB;
  --fg:#13161B; --muted:#596170; --faint:#8A919C;
  --accent:#CC1520; --accent-fg:#FFFFFF; --accent-soft:#F8DADC;
  --soft:#D9232B; --medium:#D69E00; --hard:#7D8692; --inter:#1F9142; --wet:#1D68C9;
  --land:#D3D9E1; --sea:#F5F7FA; --route:#CC1520;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101215; --surface:#181B20; --surface-2:#22262D; --line:#2E333B;
  --fg:#ECEEF1; --muted:#A1A8B3; --faint:#6E7581;
  --accent:#FF3D44; --accent-fg:#14070A; --accent-soft:#3A1619;
  --soft:#FF4C52; --medium:#FFC629; --hard:#E4E7EB; --inter:#3ACB62; --wet:#4C93F0;
  --land:#2A3038; --sea:#15181C; --route:#FF3D44;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#181B20; --surface-2:#22262D; --line:#2E333B;
  --fg:#ECEEF1; --muted:#A1A8B3; --faint:#6E7581;
  --accent:#FF3D44; --accent-fg:#14070A; --accent-soft:#3A1619;
  --soft:#FF4C52; --medium:#FFC629; --hard:#E4E7EB; --inter:#3ACB62; --wet:#4C93F0;
  --land:#2A3038; --sea:#15181C; --route:#FF3D44;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wet);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.kerb{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,var(--surface) 18px 36px)}
.top-in{max-width:1220px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:26px;font-weight:800;text-transform:uppercase;font-style:italic;letter-spacing:.02em}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--surface-2)}
.grade b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-family:var(--f-display);font-size:21px;color:var(--accent-fg);background:var(--accent)}
.grade span{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.grade span em{display:block;font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:11px;text-transform:none;letter-spacing:0}
.tabs{max-width:1220px;margin:0 auto;display:flex;gap:2px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 10px;font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-family:var(--f-data);font-size:11px;color:var(--faint);margin-left:4px}

main{max-width:1220px;margin:0 auto;padding-block:16px 64px;padding-inline:16px}
.view{display:grid;gap:16px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){ .cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start} .sticky-col{position:sticky;top:120px} }
.stack{display:grid;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h2{font-size:22px;text-transform:uppercase;font-style:italic}
.panel-h p{margin:0;color:var(--muted);font-size:13px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0}

/* ---------- botones ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;min-height:34px;text-align:left}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{display:block;font-size:11px;opacity:.75;font-weight:400}
input[type=text],input[type=date],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;max-width:100%}

/* ---------- mapa ---------- */
.map-wrap{position:relative;border-radius:8px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.map-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.map-scroll > svg{display:block;width:100%;height:auto;min-width:620px}
.map-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.map-tools .chip{min-height:30px;padding:4px 12px;font-size:12.5px}
.map-tools .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mk text{font-family:var(--f-data);font-weight:600}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- barras de nota ---------- */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.bar label{font-size:13.5px;font-weight:600}
.bar label small{font-weight:400;color:var(--muted);margin-left:4px}
.bar .v{font-family:var(--f-data);font-size:13px}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .35s ease}
.good{background:var(--inter)} .ok{background:var(--medium)} .bad{background:var(--soft)}
.t-good{color:var(--inter)} .t-ok{color:var(--medium)} .t-bad{color:var(--soft)}

.big-score{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.big-score .n{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:.9;font-style:italic}
.big-score .l{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.big-score .l small{display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted);font-size:13px}

.warns{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.warns li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;font-size:13.5px;align-items:start}
.warns li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--medium)}
.warns li.bad::before{background:var(--soft)} .warns li.good::before{background:var(--inter)}
.warns li{background:none}

/* ---------- lista del calendario ---------- */
.cal-tools{display:grid;gap:10px;margin-bottom:12px}
.field{display:grid;gap:4px}
.field > span{font-size:12px;color:var(--muted);font-weight:600}
.races{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.race{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.race.flash{animation:flash 1s ease}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.race .rn{font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center;font-style:italic}
.race .who{min-width:0}
.race .who b{font-weight:600;font-size:15px}
.race .who .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.race .acts{display:flex;gap:4px;align-items:center}
.race .sub{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;display:grid;place-items:center;font-size:14px;padding:0;line-height:1}
.ib:hover{border-color:var(--fg)}
.ib.x:hover{border-color:var(--soft);color:var(--soft)}
.gap{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
.gap button{border:0;background:var(--surface-2);width:26px;height:26px;padding:0}
.gap span{padding:0 8px;font-family:var(--f-data);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
.tag.on{background:var(--fg);color:var(--bg)}
button.tag{cursor:pointer;border-color:var(--line)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.empty{border:2px dashed var(--line);border-radius:8px;padding:20px;text-align:center;color:var(--muted)}

/* ---------- piscina de circuitos ---------- */
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:12px}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;text-align:left;display:grid;gap:5px;position:relative}
.pc:hover{border-color:var(--fg)}
.pc.in{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc .pn{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;min-width:0}
.pc .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pm{font-size:11.5px;color:var(--muted)}
.pc .chk{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:12px;font-weight:700}
.pips{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11px;color:var(--muted);align-items:center}
.pip{display:flex;gap:2px}
.pip i{width:10px;height:5px;border-radius:2px;background:var(--surface-2)}
.pip i.f{background:var(--fg)}

/* ---------- reglamento ---------- */
.sec-nav{display:flex;gap:6px;flex-wrap:wrap}
.rule{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0;padding-top:0}
.rule-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rule-h h3{font-family:var(--f-body);font-size:15.5px;font-weight:700;letter-spacing:0}
.rule .help{font-size:13px;color:var(--muted);margin:0}
.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--wet);border:1px solid currentColor;border-radius:4px;padding:1px 5px}
.ptsedit{display:flex;flex-wrap:wrap;gap:6px}
.ptsedit label{display:grid;gap:2px;font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--f-data)}
.ptsedit input{width:52px;text-align:center;padding:5px 2px;min-height:34px;font-family:var(--f-data)}
.optexpl{font-size:12.5px;color:var(--muted);margin:0;padding-left:10px;border-left:2px solid var(--line)}

.meters{display:grid;gap:10px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.who-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:4px 10px;align-items:start;background:var(--surface)}
.who-card .face{font-size:28px;line-height:1;grid-row:span 2}
.who-card b{font-size:14px}
.who-card b span{font-family:var(--f-data);font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.who-card p{margin:0;font-size:13px;color:var(--muted);grid-column:2}
.news{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.news li{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.15;padding-left:12px;border-left:4px solid var(--accent);text-wrap:balance}
.news li small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}

/* ---------- simulador ---------- */
.banner{border-radius:var(--r);padding:16px;display:grid;gap:4px;border:1px solid var(--line);background:var(--surface)}
.banner.changed{border-color:var(--accent);background:var(--accent-soft)}
.banner .big{font-family:var(--f-display);font-size:30px;font-weight:800;font-style:italic;text-transform:uppercase;line-height:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--accent-soft)}
.up{color:var(--inter);font-weight:700} .down{color:var(--soft);font-weight:700} .same{color:var(--faint)}
.chart-wrap{position:relative}
.chart-wrap > svg{display:block;width:100%;height:auto;overflow:visible}
.chart-wrap .axis text{fill:var(--muted);font-family:var(--f-data);font-size:11px}
.chart-wrap .grid line{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:6px;padding:7px 9px;font-size:12px;min-width:150px;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:4}
.tip b{display:block;font-size:12.5px;margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:3px;border-radius:2px}
.allseasons{display:grid;gap:0;border-top:1px solid var(--line)}
.allseasons button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:13.5px}
.allseasons button:hover{background:var(--surface-2)}
.allseasons .y{font-family:var(--f-display);font-size:19px;font-weight:700;font-style:italic}

/* ---------- Mi F1 ---------- */
.card-out{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.card-out > svg{display:block;width:100%;height:auto}
.versions{display:grid;gap:8px}
.ver{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;align-items:center}
.ver .vn{font-weight:700}
.ver .vm{font-size:12.5px;color:var(--muted)}
.ver .row{grid-column:1/-1}
.cmp td:first-child{color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ach div{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;gap:2px;opacity:.5}
.ach div.got{opacity:1;border-color:var(--medium);background:var(--surface)}
.ach b{font-size:13.5px}
.ach span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;text-align:center;font-size:14px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-family:var(--f-data);font-size:12px;color:var(--fg)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){ .brand h1{font-size:22px} .grade span{display:none} .tabs{gap:0;padding-inline:8px} .tab{font-size:15px;padding:9px 8px 10px;letter-spacing:.02em} .tab i{display:none} .hide-s{display:none} th,td{padding:7px 7px} }

/* ---------- rejillas por vista ---------- */
.cal-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "nota" "list" "pool"}
.a-map{grid-area:map}.a-nota{grid-area:nota}.a-list{grid-area:list}.a-pool{grid-area:pool}
@media (min-width:980px){
  .cal-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"map nota" "list nota" "pool pool";align-items:start}
  .a-nota{position:sticky;top:124px}
}
.reg-grid{display:flex;flex-direction:column;gap:16px}
.reg-grid .a-side{display:contents}
.reg-grid .a-side > :nth-child(1){order:1}
.reg-grid .a-rules{order:2}
.reg-grid .a-side > :nth-child(2){order:3}
.reg-grid .a-side > :nth-child(3){order:4}
@media (min-width:980px){
  .reg-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start}
  .reg-grid .a-side{display:grid;gap:16px;position:sticky;top:124px;max-height:calc(100vh - 140px);overflow:auto;border-radius:var(--r)}
  .reg-grid .a-side > *{order:0}
}
.sec-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:5;background:var(--bg);padding-block:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sec-nav::-webkit-scrollbar{display:none}
.sec-nav .chip{white-space:nowrap;flex:none}
@media (min-width:980px){.sec-nav{top:124px}}
.sim-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.sim-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.mi-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.mi-grid .a-side{display:grid;gap:16px;min-width:0}
@media (min-width:980px){.mi-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.a-card{position:sticky;top:124px}}
.view-sec{min-width:0}

.sec-nav a.chip{text-decoration:none;color:var(--fg)}
td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
td.real{font-size:13px;color:var(--muted)}

td.dn{white-space:normal;min-width:118px}
td small.up{color:var(--inter)} td small.down{color:var(--soft)} td small.same{color:var(--faint)}

/* ---- app instalada ---- */
[hidden]{display:none!important}
img{max-width:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100vh}
.top{top:0}
.top::before{content:"";display:block;height:env(safe-area-inset-top,0px);background:#111317}
.sec-nav{top:calc(env(safe-area-inset-top,0px) + 112px)}
main{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shot{position:fixed;inset:0;z-index:60;background:rgba(10,11,13,.92);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));gap:12px;grid-template-rows:1fr auto}
.shot img{max-height:72vh;width:auto;border-radius:12px}
.shot p{color:#ECEEF1;margin:0;text-align:center;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="kerb" aria-hidden="true"></div>
  <div class="top-in">
    <div class="brand"><h1>Fórmula <span>Perfecta</span></h1><small id="brandSub">Mi Fórmula 1</small></div>
    <div class="grade" title="Nota global: 50% calendario, 30% reglamento, 20% lo contentos que están todos"><b id="gradeN">–</b><span id="gradeL">Nota<em>Nota global</em></span></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-act="tab" data-tab="calendario" aria-selected="true">Calendario<i id="tabCalN"></i></button>
    <button class="tab" role="tab" data-act="tab" data-tab="reglamento" aria-selected="false">Reglamento</button>
    <button class="tab" role="tab" data-act="tab" data-tab="simulador" aria-selected="false">Simulador</button>
    <button class="tab" role="tab" data-act="tab" data-tab="mif1" aria-selected="false">Mi F1</button>
  </nav>
</header>
<main>
  <section id="v-calendario" class="view-sec" aria-label="Calendario"></section>
  <section id="v-reglamento" class="view-sec" aria-label="Reglamento" hidden></section>
  <section id="v-simulador" class="view-sec" aria-label="Simulador" hidden></section>

const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};
const isoD=t=>new Date(t).toISOString().slice(0,10);
const DAY=864e5;
function raceDates(st=state){const out=[];let t=parseD(st.start);st.races.forEach((r,i)=>{if(i>0)t+=7*DAY*r.gap;out.push(t);});return out;}
const dShort=t=>{const d=new Date(t);return d.getUTCDate()+' '+MESES[d.getUTCMonth()];};
const monthOf=t=>new Date(t).getUTCMonth()+1;

// ================= clima =================
function climaFit(c,m){if(c.meses.includes(m))return 1;const p=m===1?12:m-1,n=m===12?1:m+1;return (c.meses.includes(p)||c.meses.includes(n))?0.5:0;}
function climaMotivo(c,m){
  const sum=[6,7,8,9].includes(m), win=[11,12,1,2,3].includes(m);
  if(c.reg==='ME') return sum||m===5||m===10?'calor extremo (más de 40 °C)':'fuera de su temporada';
  if(c.reg==='EU') return win?'frío y riesgo de nieve':'tiempo poco fiable';
  if(c.id==='mexico-city') return 'temporada de lluvias';
  if(c.reg==='NA') return c.lat>39?(win?'frío y nieve':'tiempo poco fiable'):(sum?'calor bestial y tormentas':'tiempo poco fiable');
  if(c.lat<-10) return [6,7,8].includes(m)?'invierno allí: frío y lluvia':(m===1||m===2?'calor sofocante':'tiempo poco fiable');
  if(c.id==='kigali') return 'temporada de lluvias';
  if(c.id==='buddh') return [4,5,6].includes(m)?'calor brutal':'monzón';
  if(Math.abs(c.lat)<16) return 'lluvias tropicales casi seguras';
  if(c.reg==='AS') return sum?'calor húmedo y tifones':(win?'frío':'tiempo poco fiable');
  return 'mal tiempo para correr';
}

// ================= distancias y optimizador =================
function legs(ids){const pts=ids.map(id=>CBY[id]);const L=[];if(!pts.length)return L;L.push(hav(BASE,pts[0]));for(let i=1;i<pts.length;i++)L.push(hav(pts[i-1],pts[i]));L.push(hav(pts[pts.length-1],BASE));return L;}
const sum=a=>a.reduce((x,y)=>x+y,0);
function tourKm(ids){return sum(legs(ids));}
function tspOpt(ids){ // vuelta más corta posible (base -> todos -> base): vecino más cercano + 2-opt
  if(ids.length<3) return tourKm(ids);
  const P=[BASE,...ids.map(i=>CBY[i])];const n=P.length;const D=P.map(a=>P.map(b=>hav(a,b)));
  let best=Infinity;
  for(let s=0;s<Math.min(n,6);s++){
    const used=new Array(n).fill(false);used[0]=true;let cur=0,tour=[0];
    if(s>0){used[s]=true;tour.push(s);cur=s;}
    for(let k=tour.length;k<n;k++){let bj=-1,bd=Infinity;for(let j=0;j<n;j++)if(!used[j]&&D[cur][j]<bd){bd=D[cur][j];bj=j;}used[bj]=true;tour.push(bj);cur=bj;}
    let imp=true;while(imp){imp=false;for(let i=1;i<n-1;i++)for(let j=i+1;j<n;j++){const a=tour[i-1],b=tour[i],c=tour[j],d=tour[(j+1)%n];
      const delta=D[a][c]+D[b][d]-D[a][b]-D[c][d];if(delta<-1e-6){tour.splice(i,j-i+1,...tour.slice(i,j+1).reverse());imp=true;}}}
    let L=0;for(let i=0;i<n;i++)L+=D[tour[i]][tour[(i+1)%n]];best=Math.min(best,L);
  }
  return best;
}
function autoGaps(ids,start){ // semanas entre carreras: cerca = finde seguido, lejos = 2 semanas, máx. triples, parón en verano
  const g=[0];let t=parseD(start),streak=1,summer=false;
  for(let i=1;i<ids.length;i++){
    const d=hav(CBY[ids[i-1]],CBY[ids[i]]);let gap=d<2600?1:2;
    if(gap===1&&streak>=3) gap=2;
    const dt=new Date(t),mm=dt.getUTCMonth()+1,dd=dt.getUTCDate();
    let brk=false;
    if(!summer&&((mm===7&&dd>=18)||mm===8)){gap=Math.max(gap,4);summer=true;brk=true;}
    if(!brk&&ids.length>=22&&i>=ids.length-6&&d<4000) gap=1; // final de temporada compacto si hay muchas carreras
    if(gap===1&&streak>=3) gap=2;
    streak=gap===1?streak+1:1;
    g.push(gap);t+=gap*7*DAY;
  }
  return g;
}
function climatePenalty(ids,start){const g=autoGaps(ids,start);let t=parseD(start),p=0;ids.forEach((id,i)=>{if(i>0)t+=g[i]*7*DAY;const f=climaFit(CBY[id],monthOf(t));p+=f===1?0:f===0.5?1500:5000;});return p;}
function optimizeOrder(ids,start){
  if(ids.length<3) return ids.slice();
  const cost=o=>tourKm(o)+climatePenalty(o,start);
  let cur=ids.slice(),cc=cost(cur),best=cur.slice(),bc=cc;
  // semilla: ordenar por "mes ideal" dentro de la temporada ayuda al clima
  const seeds=[cur];
  const sm=new Date(parseD(start)).getUTCMonth()+1;
  const ideal=id=>{const ms=CBY[id].meses.map(m=>(m-sm+12)%12);ms.sort((a,b)=>a-b);return ms[0]+ms[ms.length-1]*0.01;};
  seeds.push(ids.slice().sort((a,b)=>ideal(a)-ideal(b)));
  for(const s of seeds){let o=s.slice(),oc=cost(o);let T=4000;
    for(let it=0;it<9000;it++){
      const i=1+Math.floor(Math.random()*(o.length-1)),j=Math.floor(Math.random()*o.length);if(i===j)continue;
      const n=o.slice();
      if(Math.random()<.5){const a=Math.min(i,j),b=Math.max(i,j);n.splice(a,b-a+1,...n.slice(a,b+1).reverse());}
      else{const [x]=n.splice(i,1);n.splice(j,0,x);}
      const nc=cost(n);if(nc<oc||Math.random()<Math.exp((oc-nc)/T)){o=n;oc=nc;if(oc<bc){bc=oc;best=o.slice();}}
      T*=0.9993;
    }}
  return best;
}
function cheapestInsert(ids,id,start){
  if(!ids.length) return 0;let bi=ids.length,bc=Infinity;
  for(let i=0;i<=ids.length;i++){const n=ids.slice();n.splice(i,0,id);const c=tourKm(n)+climatePenalty(n,start)*0.6;if(c<bc){bc=c;bi=i;}}
  return bi;
}

function simRules(st){const R=st.rules,total=null;const sprints=st.races.filter(r=>r.sprint).length;
  return {pts:R.pts,sprintOn:sprints>0,spts:SPTS_PRESETS[R.spts].pts,flPts:R.fl==='no'?0:1,flTop:R.fl==='top10'?10:0,polePts:+R.pole,gainEvery:+R.gain,
    best:R.best,doubleLast:R.dbl==='si',shortRace:R.short==='red',medals:R.champ==='wins',playoff:R.champ==='playoff',poTop:4,poLast:3};}
function realRules(year){
  const b={pts:[25,18,15,12,10,8,6,4,2,1],sprintOn:true,spts:[8,7,6,5,4,3,2,1],flPts:0,flTop:10,polePts:0,gainEvery:0,best:'all',doubleLast:false,shortRace:true,medals:false,playoff:false,poTop:4,poLast:3};
  if(year===1988) return {...b,pts:[9,6,4,3,2,1],bestN:11,sprintOn:false};
  if(year===2007||year===2008) return {...b,pts:[10,8,6,5,4,3,2,1],sprintOn:false};
  if(year===2010||year===2012||year===2016) return {...b,sprintOn:false};
  if(year===2021) return {...b,flPts:1,spts:[3,2,1]};
  if(year===2024) return {...b,flPts:1};
  return b;
}
const simCache=new Map();
function simulate(year,R){
  const key=year+'|'+JSON.stringify(R);if(simCache.has(key))return simCache.get(key);
  const S=SEASONS[year],nd=S.drivers.length,nt=S.teams.length,total=S.total,real=realRules(+year);
  let bestN=R.bestN||0;if(!bestN){if(R.best==='m2')bestN=total-2;else if(R.best==='m4')bestN=total-4;else if(R.best==='70')bestN=Math.round(total*0.7);}
  const per=[...Array(nd)].map(()=>[]),post=new Array(nd).fill(0),P=new Array(nd).fill(0),T=new Array(nt).fill(0);
  const wins=new Array(nd).fill(0),pods=new Array(nd).fill(0),best=new Array(nd).fill(99),hist=[...Array(nd)].map(()=>[]),seen=new Array(nd).fill(false);
  let finalists=null,base=null;
  S.rounds.forEach((rd,ri)=>{
    const add=new Array(nd).fill(0);let factor=1;
    if(R.shortRace&&rd.wp>0&&rd.wp<real.pts[0]) factor=Math.round(rd.wp/real.pts[0]*4)/4;
    const dbl=(R.doubleLast&&ri===total-1)?2:1,nStart=rd.r.length,teamOf={};
    rd.r.forEach(([d,t,pos,grid])=>{seen[d]=true;teamOf[d]=t;if(pos>0){add[d]+=(R.pts[pos-1]||0)*factor*dbl;if(pos===1)wins[d]++;if(pos<=3)pods[d]++;if(pos<best[d])best[d]=pos;
      if(R.gainEvery>0){const g=(grid||nStart)-pos;if(g>0)add[d]+=Math.floor(g/R.gainEvery);}}});
    if(R.flPts&&rd.fl!=null){const e=rd.r.find(x=>x[0]===rd.fl);if(e&&e[2]>0&&(!R.flTop||e[2]<=R.flTop))add[rd.fl]+=R.flPts;}
    if(R.polePts&&rd.pole!=null)add[rd.pole]+=R.polePts;
    if(R.sprintOn&&rd.s)rd.s.forEach(([d,t,pos])=>{seen[d]=true;if(teamOf[d]==null)teamOf[d]=t;if(pos>0)add[d]+=(R.spts[pos-1]||0);});
    for(let d=0;d<nd;d++){if(add[d]){per[d].push(add[d]);if(teamOf[d]!=null)T[teamOf[d]]+=add[d];if(finalists)post[d]+=add[d];}}
    for(let d=0;d<nd;d++){P[d]=bestN>0?sum(per[d].slice().sort((a,b)=>b-a).slice(0,bestN)):sum(per[d]);
      if(finalists&&finalists.includes(d))P[d]=base[d]+post[d];}
    if(R.playoff&&!finalists&&ri===total-R.poLast-1){
      const o=[...Array(nd).keys()].sort((a,b)=>P[b]-P[a]||wins[b]-wins[a]);finalists=o.slice(0,R.poTop);base={};
      finalists.forEach(d=>{base[d]=5*wins[d];P[d]=base[d];});
    }
    for(let d=0;d<nd;d++)hist[d].push(Math.round(P[d]*100)/100);
  });
  const cmp=(a,b)=>R.medals?(wins[b]-wins[a]||P[b]-P[a]):(P[b]-P[a]||wins[b]-wins[a]||best[a]-best[b]);
  const order=[...Array(nd).keys()].filter(d=>seen[d]).sort((a,b)=>{if(finalists){const fa=finalists.includes(a)?0:1,fb=finalists.includes(b)?0:1;if(fa!==fb)return fa-fb;}return cmp(a,b);});
  const teams=[...Array(nt).keys()].filter(t=>T[t]>0||S.offC.some(e=>e[0]===t)).sort((a,b)=>T[b]-T[a]);
  const res={order,P,T,wins,pods,hist,teams,finalists};simCache.set(key,res);return res;
}
const SEASON_LIST=['2026','2025','2024','2021','2016','2012','2010','2008','2007','1988'];
const SEASON_BLURB={'2026':'En curso: Antonelli lidera con Mercedes.','2025':'Norris gana por 2 puntos. Tres pilotos con opciones al final.','2024':'Verstappen campeón; McLaren gana el de equipos.','2021':'Verstappen contra Hamilton hasta la última vuelta.','2016':'Rosberg gana a su compañero Hamilton por 5 puntos.','2012':'Vettel gana a Alonso por 3 puntos.','2010':'Cuatro pilotos con opciones en la última carrera.','2008':'Hamilton gana por 1 punto en la última curva.','2007':'Räikkönen gana por 1 punto a los dos McLaren.','1988':'Prost suma más puntos, pero solo contaban los 11 mejores resultados.'};
function realChamp(y){const S=SEASONS[y];return S.off[0][0];}
function allSeasons(R){return SEASON_LIST.map(y=>{const r=simulate(y,R);const real=realChamp(y);return {y,mine:r.order[0],real,changed:r.order[0]!==real};});}

// ================= nota del calendario =================
function calAnalysis(st=state){
  const ids=st.races.map(r=>r.id),cs=ids.map(i=>CBY[i]),n=ids.length,dates=raceDates(st);
  const A={n,ids,dates,sprints:st.races.filter(r=>r.sprint).length,warns:[],legs:legs(ids)};
  A.km=sum(A.legs);A.opt=n>=2?tspOpt(ids):A.km;
  const parts={};
  // viajes
  parts.viajes=n<2?100:clamp(100*Math.pow(A.opt/A.km,1.2));
  // clima
  A.clima=cs.map((c,i)=>{const m=monthOf(dates[i]);return {f:climaFit(c,m),m};});
  parts.clima=n?100*sum(A.clima.map(x=>x.f))/n:0;
  // espectáculo
  const avg=k=>n?sum(cs.map(c=>c[k]))/n:0;
  const perfiles=new Set(cs.map(c=>c.perfil)).size;
  parts.esp=n?clamp((avg('adel')-1)/4*100*0.85+perfiles/3*15):0;
  // variedad
  const streetR=n?cs.filter(c=>c.tipo==='calle').length/n:0;
  const conts=new Set(cs.map(c=>CONT[c.reg])).size;A.conts=conts;A.streetR=streetR;
  parts.variedad=n?(clamp(100-Math.max(0,Math.abs(streetR-0.3)-0.1)*250)+clamp(conts/6*100)+perfiles/3*100)/3:0;
  // historia y ambiente
  parts.hist=n?clamp(((avg('hist')+avg('amb'))/2-1)/4*100):0;
  // salud del paddock
  let pad=100;
  if(n>22)pad-=(n-22)*7;if(n<18)pad-=(18-n)*5;
  let streak=1;A.triples=0;A.quads=0;A.b2bLong=[];
  for(let i=1;i<n;i++){const g=st.races[i].gap;if(g===1){streak++;if(A.legs[i]>7000)A.b2bLong.push(i);}else{if(streak===3)A.triples++;if(streak>=4)A.quads++;streak=1;}}
  if(streak===3)A.triples++;if(streak>=4)A.quads++;
  pad-=A.triples*5+A.quads*16+A.b2bLong.length*6;
  // parón de verano: mayor hueco entre carreras con fecha entre el 1 de julio y el 15 de septiembre
  let maxSummer=0;for(let i=1;i<n;i++){const d=new Date(dates[i-1]),mm=d.getUTCMonth()+1;if((mm>=7&&mm<=8)||(mm===9&&d.getUTCDate()<=15)||(mm===6&&d.getUTCDate()>=20))maxSummer=Math.max(maxSummer,st.races[i].gap);}
  A.summer=maxSummer;if(n>=8&&maxSummer<3)pad-=15;
  A.end=n?dates[n-1]:0;const ed=n?new Date(A.end):null;A.lateEnd=ed&&(ed.getUTCMonth()===11&&ed.getUTCDate()>12||ed.getUTCFullYear()>new Date(dates[0]).getUTCFullYear());
  if(A.lateEnd)pad-=10;
  const sd=n?new Date(dates[0]):null;A.earlyStart=sd&&(sd.getUTCMonth()<1||(sd.getUTCMonth()===1&&sd.getUTCDate()<22));if(A.earlyStart)pad-=6;
  parts.paddock=n?clamp(pad):0;
  // negocio
  parts.negocio=n?clamp((avg('canon')-1)/4*100*0.7+Math.min(n,24)/24*30):0;
  A.parts=parts;
  const W={viajes:.18,clima:.18,esp:.14,variedad:.10,hist:.16,paddock:.14,negocio:.10};
  A.score=n?sum(Object.keys(W).map(k=>parts[k]*W[k])):0;
  A.avgAdel=avg('adel');A.avgHist=avg('hist');
  // avisos
  const W2=[];
  cs.forEach((c,i)=>{const {f,m}=A.clima[i];if(f===0)W2.push({t:'bad',s:`${c.n} en ${MESES_L[m-1]}: ${climaMotivo(c,m)}.`,i});});
  A.b2bLong.forEach(i=>W2.push({t:'bad',s:`De ${cs[i-1].n} a ${cs[i].n} en una semana: ${fmt(A.legs[i])} km sin descanso.`,i}));
  for(let i=1;i<n;i++){if(A.legs[i]>9500&&!A.b2bLong.includes(i))W2.push({t:'ok',s:`Salto enorme: ${cs[i-1].n} → ${cs[i].n} (${fmt(A.legs[i])} km).`,i});}
  if(A.quads)W2.push({t:'bad',s:`${A.quads===1?'Hay un tramo':'Hay '+A.quads+' tramos'} de 4 o más findes seguidos. Los mecánicos no aguantan.`});
  if(A.triples)W2.push({t:'ok',s:`${A.triples} triplete${A.triples>1?'s':''} (3 findes seguidos).`});
  if(n>=8&&A.summer<3)W2.push({t:'bad',s:'No hay parón de verano: pon al menos 3 semanas libres en julio o agosto.'});
  else if(n>=8)W2.push({t:'good',s:`Parón de verano de ${A.summer} semanas.`});
  if(n>24)W2.push({t:'bad',s:`${n} carreras son demasiadas: lo sano es entre 18 y 22.`});
  if(n>0&&n<16)W2.push({t:'ok',s:`Solo ${n} carreras: la temporada se queda corta.`});
  if(A.lateEnd)W2.push({t:'ok',s:'Acabas muy tarde: la temporada se come las Navidades.'});
  if(A.earlyStart)W2.push({t:'ok',s:'Empiezas muy pronto: casi no hay tiempo para la pretemporada.'});
  if(n>=6&&parts.viajes>=88)W2.push({t:'good',s:'Viajes casi perfectos: la ruta está muy bien ordenada.'});
  else if(n>=6&&parts.viajes<55)W2.push({t:'bad',s:`Ruta en zigzag: podrías ahorrarte ${fmt(A.km-A.opt)} km ordenando mejor.`});
  if(n&&A.clima.every(x=>x.f===1))W2.push({t:'good',s:'Todas las carreras con buen tiempo.'});
  A.warns=W2;
  return A;
}

// ================= medidores del reglamento =================
function meters(st,A){
  const M={...METER_BASE};const add=fx=>{for(const k in fx)M[k]+=fx[k];};
  RULES.forEach(r=>{const o=r.opts.find(o=>o.v===st.rules[r.id]);if(o&&o.fx)add(o.fx);});
  add(ptsFx(st.rules.pts));
  const ratio=A.n?A.sprints/A.n:0; // findes sprint: lo de 2026 son 6 de 23
  add({esp:(ratio-0.26)*24,trad:-(ratio-0.26)*28,aho:-(ratio-0.26)*6,seg:-(ratio-0.26)*4});
  // el calendario también cuenta
  if(A.n){add({esp:(A.avgAdel-3)*6,trad:(A.avgHist-3)*7,eco:clamp((105000-A.km)/7000,-12,10)});}
  for(const k in M)M[k]=clamp(Math.round(M[k]));
  return M;
}
function regScore(M){const v=Object.values(M);return 0.6*sum(v)/v.length+0.4*Math.min(...v);}

const VB_WORLD=[0,18,1000,428];
function vbEurope(){const a=proj(61,-11),b=proj(34.5,31),c=proj(61,31),d=proj(34.5,-11);const x0=Math.min(a[0],d[0])-10,x1=Math.max(b[0],c[0])+10,y0=Math.min(a[1],c[1])-6,y1=Math.max(b[1],d[1])+6;
  const w=x1-x0,h=w*428/1000;return [x0,y0-(h-(y1-y0))/2,w,h];}
function mapSVG(ids,{zoom='mundo',card=false,hl=-1,px=0}={}){
  const vb=zoom==='europa'?vbEurope():VB_WORLD,s=card?vb[2]/1000:vb[2]/Math.max(px||ui.mapW||620,620);
  const col=card?{land:'#2A3038',sea:'#15181C',route:'#FF3D44',mk:'#ECEEF1',mkt:'#111317',base:'#6E7581'}:null;
  const land=card?col.land:'var(--land)',route=card?col.route:'var(--route)';
  const P=ids.map(i=>CBY[i]);const seg=[];
  const pts=[BASE,...P,BASE];
  for(let i=0;i<pts.length-1;i++){if(pts.length<3)break;const line=gcLine(pts[i],pts[i+1],28).map(p=>proj(p.lat,p.lon));let d='',prev=null;
    line.forEach(([x,y])=>{d+=(prev&&Math.abs(x-prev[0])<400?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);prev=[x,y];});
    const isBase=i===0||i===pts.length-2;seg.push(`<path d="${d}" fill="none" stroke="${isBase?(card?col.base:'var(--faint)'):route}" stroke-width="${(isBase?1.2:2)*s}" ${isBase?`stroke-dasharray="${4*s} ${4*s}"`:''} stroke-linecap="round" opacity="${isBase?.8:.85}"/>`);}
  const bp=proj(BASE.lat,BASE.lon);
  const mk=P.map((c,i)=>{const [x,y]=proj(c.lat,c.lon);const r=(card?8:8)*s,on=i===hl;
    return `<g class="mk" data-act="mk" data-i="${i}" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r*(on?1.35:1)}" fill="${card?col.mk:(on?'var(--accent)':'var(--fg)')}" stroke="${card?col.sea:'var(--sea)'}" stroke-width="${1.5*s}"/><text x="${x.toFixed(1)}" y="${(y+r*0.38).toFixed(1)}" text-anchor="middle" font-size="${r*1.05}" fill="${card?col.mkt:(on?'var(--accent-fg)':'var(--bg)')}" ${card?'font-family="Menlo,monospace" font-weight="700"':''}>${i+1}</text><title>${esc(c.n)}</title></g>`;}).reverse().join('');
  return `<svg viewBox="${vb.join(' ')}" role="img" aria-label="Mapa del calendario con ${ids.length} carreras" ${card?'':'preserveAspectRatio="xMidYMid meet"'}><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="${card?col.sea:'var(--sea)'}"/><path d="${LAND.d}" fill="${land}"/>${seg.join('')}<rect x="${bp[0]-4*s}" y="${bp[1]-4*s}" width="${8*s}" height="${8*s}" fill="${card?col.base:'var(--faint)'}"><title>Base de los equipos (Reino Unido)</title></rect>${mk}</svg>`;
}

function chartSVG(y,res,mine,real,cw=640){
  const S=SEASONS[y],n=S.rounds.length;
  let ent=S.off.slice(0,4).map(e=>e[0]);if(!ent.includes(mine.order[0]))ent.push(mine.order[0]);
  const W=Math.round(cw),H=Math.round(clamp(cw*0.58,230,320)),ml=38,mr=cw<480?74:92,mt=12,mb=30,iw=W-ml-mr,ih=H-mt-mb;
  const maxV=Math.max(1,...ent.map(d=>res.hist[d][n-1]||0),...ent.map(d=>Math.max(...res.hist[d])));
  const step=[1,2,5,10,20,25,50,100,200].find(s=>maxV/s<=6)||200;const top=Math.ceil(maxV/step)*step;
  const x=i=>ml+(n<=1?iw/2:i/(n-1)*iw),yv=v=>mt+ih-(v/top)*ih;
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${ml}" x2="${ml+iw}" y1="${yv(v)}" y2="${yv(v)}"/>`;
  let ax='';for(let v=0;v<=top;v+=step)ax+=`<text x="${ml-6}" y="${yv(v)+4}" text-anchor="end">${v}</text>`;
  const every=Math.ceil(n/8);S.rounds.forEach((rd,i)=>{if(i%every===0||i===n-1)ax+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${i+1}</text>`;});
  const lines=ent.map((d,k)=>{const pts=res.hist[d].map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${yv(v).toFixed(1)}`).join('');return `<path d="${pts}" fill="none" stroke="${SER[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${yv(res.hist[d][n-1])}" r="4" fill="${SER[k]}" stroke="var(--surface)" stroke-width="2"/>`;}).join('');
  // etiquetas directas sin solaparse
  const lab=ent.map((d,k)=>({k,d,y:yv(res.hist[d][n-1])})).sort((a,b)=>a.y-b.y);for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<14)lab[i].y=lab[i-1].y+14;
  const labels=lab.map(l=>`<text x="${x(n-1)+8}" y="${l.y+4}" font-size="11.5" fill="var(--fg)" font-family="var(--f-data)">${esc(S.drivers[l.d][2])} ${fmt1(res.hist[l.d][n-1]).replace(',0','')}</text>`).join('');
  chartSVG.meta={y,ent,res,x,n,W,H,mt,ih};
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos acumulados por carrera"><g class="grid">${g}</g><g class="axis">${ax}</g>${lines}${labels}<line id="xh" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/><rect id="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" id="tip" hidden></div>
   <div class="legend">${ent.map((d,k)=>`<span><i style="background:${SER[k]}"></i>${esc(S.drivers[d][1])}</span>`).join('')}</div>`;
}
function bindChart(){
  const wrap=$('#chart');if(!wrap)return;const svg=$('svg',wrap),hit=$('#hit',wrap),tip=$('#tip',wrap),xh=$('#xh',wrap),m=chartSVG.meta;
  const move=e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*m.W;let best=0,bd=1e9;for(let i=0;i<m.n;i++){const d=Math.abs(m.x(i)-sx);if(d<bd){bd=d;best=i;}}
    const S=SEASONS[m.y],rd=S.rounds[best];xh.setAttribute('x1',m.x(best));xh.setAttribute('x2',m.x(best));xh.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${best+1}. GP ${esc(GP[rd.gp]||rd.gp)}</b>${m.ent.map((d,k)=>({d,k,v:m.res.hist[d][best]})).sort((a,b)=>b.v-a.v).map(o=>`<div><span><i style="background:${SER[o.k]}"></i>${esc(S.drivers[o.d][2])}</span><span class="num">${fmt1(o.v).replace(',0','')}</span></div>`).join('')}`;
    tip.hidden=false;const px=m.x(best)/m.W*r.width;tip.style.left=Math.min(Math.max(px,80),r.width-80)+'px';tip.style.top=(m.mt/m.H*r.height+4)+'px';tip.style.transform='translate(-50%,0)';};
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');});

    if(ix>=0){state.races.splice(ix,1);if(state.races[0])state.races[0].gap=0;keepScroll(commit);toast(`${CBY[id].n} quitado`);}
    else{const ids=state.races.map(r=>r.id),pos=cheapestInsert(ids,id,state.start);const prev=ids[pos-1];
      const gap=pos===0?0:(hav(CBY[prev],CBY[id])<2600?1:2);state.races.splice(pos,0,{id,gap,sprint:false});if(pos===0&&state.races[1])state.races[1].gap=hav(CBY[id],CBY[state.races[1].id])<2600?1:2;
      keepScroll(commit);toast(`${CBY[id].n} añadido en la posición ${pos+1}`);}
    return;}
  if(a==='mk'||a==='goto'){e.preventDefault();flash(i,true);return;}
  if(a==='optimize'){const before=O.A.score;const ids=optimizeOrder(state.races.map(r=>r.id),state.start);const sp=new Set(state.races.filter(r=>r.sprint).map(r=>r.id));const g=autoGaps(ids,state.start);
    state.races=ids.map((id,k)=>({id,gap:g[k],sprint:sp.has(id)}));commit();const after=O.A.score;toast(after>before+0.05?`Nota del calendario: ${fmt1(before/10)} → ${fmt1(after/10)}`:'Ya estaba muy bien ordenado');return;}
  if(a==='autodates'){const g=autoGaps(state.races.map(r=>r.id),state.start);state.races.forEach((r,k)=>r.gap=g[k]);keepScroll(commit);toast('Fechas recalculadas');return;}
  if(a==='presetYes'){if(pendingPreset){state=preset(pendingPreset,{name:state.name,rules:state.rules,start:state.start});}ui.confirm=null;pendingPreset=null;commit();return;}
  if(a==='cancel'){ui.confirm=null;pendingPreset=null;keepScroll(render);return;}
  if(a==='rule'){const before=O.M;R[b.dataset.r]=b.dataset.v;keepScroll(commit);meterDelta(before,O.M);return;}
  if(a==='ptsPreset'){const before=O.M;const p=PTS_PRESETS.find(p=>p.id===b.dataset.p);R.pts=p.pts.slice();R.ptsPreset=p.id;keepScroll(commit);meterDelta(before,O.M);return;}
  if(a==='ptsCustom'){R.ptsPreset='custom';keepScroll(render);$('#pt-0')?.focus();return;}
  if(a==='ptsAdd'&&R.pts.length<20){R.pts.push(Math.max(0,(R.pts[R.pts.length-1]||1)-1));R.ptsPreset='custom';keepScroll(commit);return;}
  if(a==='ptsDel'&&R.pts.length>1){R.pts.pop();R.ptsPreset='custom';keepScroll(commit);return;}
  if(a==='sec'){e.preventDefault();$('#sec-'+b.dataset.s)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(a==='season'){ui.season=b.dataset.y;render();$('#v-simulador')?.scrollIntoView({block:'start'});return;}
  if(a==='simMode'){ui.simMode=b.dataset.m;keepScroll(render);return;}
  if(a==='chartMode'){ui.chartMode=b.dataset.m;keepScroll(render);return;}
  if(a==='png'){downloadCard();return;}
  if(a==='saveVer'){saveVersion();return;}
  if(a==='loadVer'){const v=VERS.find(v=>v.id===b.dataset.id);const s=v&&sanitize(v.state);if(s){state=s;commit();toast(`Cargada: ${v.name}`);}return;}
  if(a==='delVer'){ui.confirm='del:'+b.dataset.id;keepScroll(render);return;}
  if(a==='delVerYes'){deleteVersion(b.dataset.id);return;}
  if(a==='copyCode'){const code='FP1:'+btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    const fallback=()=>{const t=$('#codeIn');t.value=code;t.select();toast('Código seleccionado: cópialo a mano');};
    try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado'),fallback);}catch(err){fallback();}return;}
  if(a==='loadCode'){const raw=($('#codeIn').value||'').trim().replace(/^FP1:/,'');try{const s=sanitize(JSON.parse(decodeURIComponent(escape(atob(raw)))));if(!s)throw 0;state=s;commit();toast('Código cargado');}catch(err){toast('Ese código no es válido: cópialo entero, empieza por FP1:');}return;}
  if(a==='reset'){ui.confirm='reset';keepScroll(render);return;}
  if(a==='resetYes'){state=preset('real2026');ui.confirm=null;commit();toast('Vuelta a la F1 real de 2026');return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='startDate'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){state.start=t.value;keepScroll(commit);return;}
  if(t.id==='presetSel'&&t.value){pendingPreset=t.value;if(state.races.length){ui.confirm='preset';keepScroll(render);}else{state=preset(pendingPreset,{name:state.name,rules:state.rules,start:state.start});pendingPreset=null;commit();}return;}
  if(t.dataset.pi!=null){const R=state.rules;R.pts[+t.dataset.pi]=Math.max(0,Math.min(100,Math.round(Number(t.value)||0)));R.ptsPreset=PTS_PRESETS.find(p=>p.pts.join()===R.pts.join())?.id||'custom';
    setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;keepScroll(commit);if(id&&/^pt-/.test(id)){const el=$('#'+id);if(el){el.focus({preventScroll:true});el.select&&el.select();}}},0);return;}
  if(t.dataset.act==='cmp'){const id=t.dataset.id;ui.cmp=t.checked?[...ui.cmp.filter(x=>x!==id),id].slice(-2):ui.cmp.filter(x=>x!==id);keepScroll(render);return;}
  if(t.id==='champName'){state.name=t.value.trim().slice(0,40)||'Mi Fórmula 1';keepScroll(commit);return;}
});
let qTimer=null;
document.addEventListener('input',e=>{if(e.target.id==='poolQ'){ui.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>{const pos=e.target.selectionStart;keepScroll(render);const q=$('#poolQ');if(q){q.focus();q.setSelectionRange(pos,pos);}},250);}});
function flash(i,scroll){requestAnimationFrame(()=>{const el=$('#race-'+i);if(!el)return;if(scroll)el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');});}

// ================= arranque =================
function start(data){
  const d=data&&data.state?sanitize(data.state):sanitize(store.get('fp-draft'));if(d)state=d;
  if(data&&data.ui)ui={...ui,...data.ui,confirm:null};
  const h=(location.hash||'').slice(1);if(['calendario','reglamento','simulador','mif1'].includes(h))ui.tab=h;
  render();initStorage();
}
window.claude?.hot?.snapshot?.(()=>({state,ui}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{
  reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Hay una versión nueva: cierra y abre la app');});});
}).catch(()=>{});});}
</script>
